    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            background-image: 
                url('https://www.transparenttextures.com/patterns/diagonal-waves.png'),
                radial-gradient(circle at top right, #fdf4ff, #e0e7ff, #f0fdf4);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Formas de fondo abstractas */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.7;
            z-index: -1;
        }
        .shape-1 { width: 400px; height: 400px; background: #fbcfe8; top: -100px; left: -100px; animation: floatShape 20s infinite alternate; }
        .shape-2 { width: 500px; height: 500px; background: #bfdbfe; bottom: -150px; right: -150px; animation: floatShape 25s infinite alternate-reverse; }
        .shape-3 { width: 300px; height: 300px; background: #fef08a; top: 40%; left: 30%; animation: floatShape 22s infinite alternate; }

        @keyframes floatShape {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        /* Diseño del Ticket base */
        .ticket-shape {
            position: relative;
            background-color: currentColor;
            border-radius: 12px;
            -webkit-mask-image: radial-gradient(circle at 10px 10px, transparent 0, black 0);
            mask-image: radial-gradient(circle at 10px 10px, transparent 0, black 0);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            transform-style: preserve-3d;
        }

        /* Huecos (punch holes) */
        .ticket-cutout-top, .ticket-cutout-bottom {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: transparent;
            border-radius: 50%;
            right: 25%;
            transform: translateX(50%);
            z-index: 10;
        }
        .ticket-cutout-top { top: -15px; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1); }
        .ticket-cutout-bottom { bottom: -15px; box-shadow: inset 0 3px 5px rgba(0,0,0,0.1); }

        /* Línea punteada y bordes dentados */
        .ticket-divider-line {
            position: absolute;
            top: 15px;
            bottom: 15px;
            right: 25%;
            border-right: 3px dashed rgba(255, 255, 255, 0.5);
            z-index: 10;
        }
        .ticket-edges {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background-image: radial-gradient(circle at 0px 10px, transparent 10px, currentColor 11px);
            background-size: 10px 20px;
            background-repeat: repeat-y;
        }
        .edge-left { left: 0; background-position: left; transform: scaleX(-1); }
        .edge-right { right: 0; background-position: left; }

        /* Patrón geométrico */
        .ticket-pattern {
            background-image: 
                url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            background-position: center;
        }

        /* Animaciones Orgánicas y Fluidas */
        :root {
            --organic-ease: cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        @keyframes breathe-natural {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 8px 6px rgba(0,0,0,0.2)); }
            50% { transform: scale(1.08) rotate(3deg); filter: drop-shadow(0 15px 12px rgba(0,0,0,0.15)); }
        }
        @keyframes levitate-natural {
            0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 8px 6px rgba(0,0,0,0.2)); }
            50% { transform: translateY(-10px) rotate(-2deg); filter: drop-shadow(0 20px 15px rgba(0,0,0,0.1)); }
        }
        @keyframes float-natural {
            0%, 100% { transform: translate(0, 0) rotate(0deg); filter: drop-shadow(0 8px 6px rgba(0,0,0,0.2)); }
            33% { transform: translate(3px, -6px) rotate(2deg); filter: drop-shadow(0 12px 10px rgba(0,0,0,0.15)); }
            66% { transform: translate(-3px, -3px) rotate(-1deg); filter: drop-shadow(0 10px 8px rgba(0,0,0,0.18)); }

        .font-ticket {
            font-family: 'Montserrat', sans-serif;
        }

        .perspective-container {
            perspective: 1000px;
        }
    </style>

        let audioCtx = null;
        const playHoverSound = () => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (error) {
                console.warn("Audio interaction requires user gesture first.");
            }

        const Ticket = ({ data, onClick }) => {
            const ticketRef = useRef(null);
            const [transformStyle, setTransformStyle] = useState("");
            const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });

            const handleMouseMove = (e) => {
                if (!ticketRef.current) return;
                
                const rect = ticketRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12; 
                const rotateY = ((x - centerX) / centerX) * 12;

                setTransformStyle(`rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`);
                
                setGlare({
                    x: (x / rect.width) * 100,
                    y: (y / rect.height) * 100,
                    opacity: 1
                });
            };

            const handleMouseLeave = () => {
                setTransformStyle("rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
                setGlare(prev => ({ ...prev, opacity: 0 }));
            };

            const handleMouseEnter = () => {
                playHoverSound();
            };

            return (
                <div 
                    className="w-full h-40 sm:h-48 cursor-pointer perspective-container group"
                    onClick={() => onClick(data)}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}

                            }}
                        ></div>

                        <div className="absolute inset-0 ticket-pattern pointer-events-none opacity-40 z-0"></div>

                        <div className={`ticket-edges edge-left text-${data.color.replace('bg-', '')}`}></div>

                                {data.shortTitle}
                            </h2>
                        </div>

                        <div className="w-1/4 flex flex-col items-center justify-center p-2 relative z-20" style={{ transform: 'translateZ(30px)' }}>

                            </div>

                style.textContent = `
                    @keyframes fadeIn {
                        from { opacity: 0; transform: scale(0.95) translateY(10px); }
                        to { opacity: 1; transform: scale(1) translateY(0); }
                    }
                `;
                document.head.appendChild(style);
                return () => document.head.removeChild(style);
            }, []);

            return (
                <div className="min-h-screen py-10 px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="max-w-6xl mx-auto mb-20 relative mt-4">
                        <div className="relative overflow-hidden bg-white/50 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl border border-white p-8 sm:p-14 flex flex-col md:flex-row items-center justify-between gap-10">
                            <div className="absolute -top-20 -right-20 w-64 h-64 bg-pink-300 rounded-full blur-3xl opacity-40 pointer-events-none"></div>
                            <div className="absolute -bottom-20 -left-20 w-64 h-64 bg-blue-300 rounded-full blur-3xl opacity-40 pointer-events-none"></div>
                            
                            <div className="text-left flex-1 relative z-10">
                                <span className="inline-flex items-center gap-2 py-1.5 px-4 rounded-full bg-indigo-100 text-indigo-800 text-sm font-bold tracking-widest mb-6 uppercase shadow-sm">
                                    <span className="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                                    Beneficios Exclusivos
                                </span>
                                <h1 className="font-ticket text-5xl sm:text-6xl md:text-7xl font-black text-gray-900 drop-shadow-sm mb-4 uppercase tracking-tighter leading-[0.9]">
                                    Tiquetera <br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">
                                        Estudiantil
                                    </span>
                                </h1>
                                <p className="text-lg md:text-xl text-gray-700 font-medium max-w-xl leading-relaxed">
                                    ¡Pasa el mouse sobre los tiquetes para ver la magia! Demuestra que ser estudiante paga desbloqueando descuentos increíbles con tu correo institucional <strong className="text-gray-900 bg-yellow-200/50 px-1 rounded">.edu.co</strong>.
                                </p>
                            </div>
                            
                            <div className="relative z-10 flex-shrink-0 animate-emoji-2 hidden md:block">
                                <div className="text-[9rem] drop-shadow-2xl">🎟️</div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-y-12 gap-x-10">
                        {ticketData.map(ticket => (
                            <div key={ticket.id} className="flex justify-center">
                                <div className="w-full max-w-[450px]"> 
                                    <Ticket 
                                        data={ticket} 
                                        onClick={(t) => { setSelectedTicket(t); setIsModalOpen(true); }} 
                                    />
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Pie de página restaurado */}
                    <div className="max-w-4xl mx-auto text-center mt-24 pb-12 text-gray-800 font-medium px-4 relative z-10">
                        <div className="bg-white/60 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-xl border border-white mb-6 transform transition hover:scale-[1.01]">
                            <p className="text-xl sm:text-2xl mb-4 text-gray-900 leading-snug">
                                Que ser estudiante no solo sea un sacrificio, <br className="hidden sm:block"/>
                                <strong className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 font-black text-2xl sm:text-3xl">¡Sácale provecho a tu correo y carné!</strong>
                            </p>
                            <p className="text-base sm:text-lg opacity-80 text-gray-700 max-w-2xl mx-auto">
                                Cada semestre no es solo un gasto, también es la llave para acceder a cientos de beneficios por todo el país y el mundo.
                            </p>
                        </div>
                        <p className="text-sm opacity-60 font-semibold tracking-wide uppercase">Haz clic en cualquier ticket para ver los detalles completos.</p>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} ticket={selectedTicket} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
