<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiquetera de Descuentos Estudiantiles 3D</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Montserrat for bold, modern headers -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Fondo claro con imagen de textura y degradado sutil */
            background-color: #f8fafc;
            background-image: 
                url('https://www.transparenttextures.com/patterns/diagonal-waves.png'),
                radial-gradient(circle at top right, #fdf4ff, #e0e7ff, #f0fdf4);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Formas abstractas de fondo claras y pastel */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.7;
            z-index: -1;
        }
        .shape-1 { width: 400px; height: 400px; background: #fbcfe8; top: -100px; left: -100px; animation: floatShape 20s infinite alternate; }
        .shape-2 { width: 500px; height: 500px; background: #bfdbfe; bottom: -150px; right: -150px; animation: floatShape 25s infinite alternate-reverse; }
        .shape-3 { width: 300px; height: 300px; background: #fef08a; top: 40%; left: 30%; animation: floatShape 22s infinite alternate; }

        @keyframes floatShape {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        /* 
           Rediseño de la forma del Ticket
           Inspirado en "Captura de pantalla 2026-08-13 002526.png"
           Bordes semicirculares en los laterales y patrón sutil de fondo.
        */
        .ticket-shape {
            position: relative;
            background-color: currentColor; /* El color se define por clase de Tailwind */
            border-radius: 12px;
            /* Usamos radial-gradient para crear los "mordiscos" circulares en los laterales y un borde punteado general */
            -webkit-mask-image: radial-gradient(circle at 10px 10px, transparent 0, black 0);
            mask-image: radial-gradient(circle at 10px 10px, transparent 0, black 0);
            /* Sombra interna para dar volumen */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        /* Los huecos (punch holes) que separan el ticket */
        .ticket-cutout-top, .ticket-cutout-bottom {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: transparent;
            border-radius: 50%;
            right: 25%;
            transform: translateX(50%);
            z-index: 10;
        }

        .ticket-cutout-top {
            top: -15px;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1); /* Efecto 3D en el recorte */
        }

        .ticket-cutout-bottom {
            bottom: -15px;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1);
        }

        /* Línea punteada de separación */
        .ticket-divider-line {
            position: absolute;
            top: 15px;
            bottom: 15px;
            right: 25%;
            border-right: 3px dashed rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        /* Bordes dentados (zig-zag) a los lados */
        .ticket-edges {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background-image: radial-gradient(circle at 0px 10px, transparent 10px, currentColor 11px);
            background-size: 10px 20px;
            background-repeat: repeat-y;
        }
        .edge-left { left: 0; background-position: left; transform: scaleX(-1); }
        .edge-right { right: 0; background-position: left; }


        /* Patrón geométrico sutil para el fondo del ticket (como en la imagen) */
        .ticket-pattern {
            background-image: 
                url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            background-position: center;
        }

        /* 
           Animaciones Orgánicas para Emojis/Figuras 3D
           Movimientos propios (respiración, levitación suave) sin ir de lado a lado
        */
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 8px rgba(0,0,0,0.3)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 15px 12px rgba(0,0,0,0.2)); }
        }
        @keyframes gentle-levitate {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 10px 8px rgba(0,0,0,0.3)); }
            50% { transform: translateY(-8px); filter: drop-shadow(0 18px 10px rgba(0,0,0,0.15)); }
        }
        @keyframes soft-pulse {
            0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 10px 8px rgba(0,0,0,0.3)); }
            50% { transform: scale(1.04) translateY(-4px); filter: drop-shadow(0 14px 10px rgba(0,0,0,0.2)); }
        }

        /* Variaciones de animación para que se vean dinámicos y vivos */
        .animate-emoji-1 { animation: breathe 3.5s ease-in-out infinite; display: inline-block; }
        .animate-emoji-2 { animation: gentle-levitate 4s ease-in-out infinite 0.5s; display: inline-block; }
        .animate-emoji-3 { animation: soft-pulse 3.8s ease-in-out infinite 1s; display: inline-block; }

        /* Tipografía del Ticket */
        .font-ticket {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

                                    Beneficios Exclusivos
                                </span>
                                <h1 className="font-ticket text-5xl sm:text-6xl md:text-7xl font-black text-gray-900 drop-shadow-sm mb-4 uppercase tracking-tighter leading-[0.9]">
                                    Tiquetera <br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">
                                        Estudiantil
                                    </span>
                                </h1>
                                <p className="text-lg md:text-xl text-gray-700 font-medium max-w-xl leading-relaxed">
                                    ¡Demuestra que ser estudiante paga! Desbloquea descuentos increíbles usando tu correo institucional <strong className="text-gray-900 bg-yellow-200/50 px-1 rounded">.edu.co</strong>.
                                </p>
                            </div>
                            
                            {/* Ilustración / Emoji del banner */}
                            <div className="relative z-10 flex-shrink-0 animate-emoji-2 hidden md:block">
                                <div className="text-[9rem] drop-shadow-2xl">🎟️</div>
                            </div>
                        </div>
                    </div>

                    {/* Cuadrícula de Tickets - Ajustada a max-w-[450px] para alargarlos */}
                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-y-12 gap-x-10">
                        {ticketData.map(ticket => (
                            <div key={ticket.id} className="flex justify-center">
                                <div className="w-full max-w-[450px]"> 
                                    <Ticket 
                                        data={ticket} 
                                        onClick={handleTicketClick} 
                                    />
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Pie de página con mensaje inspirador */}
                    <div className="max-w-4xl mx-auto text-center mt-24 pb-12 text-gray-800 font-medium px-4 relative z-10">
                        <div className="bg-white/60 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-xl border border-white mb-6 transform transition hover:scale-[1.01]">
                            <p className="text-xl sm:text-2xl mb-4 text-gray-900 leading-snug">
                                Que ser estudiante no solo sea un sacrificio, <br className="hidden sm:block"/>
                                <strong className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 font-black text-2xl sm:text-3xl">¡Sácale provecho a tu correo y carné!</strong>
                            </p>
                            <p className="text-base sm:text-lg opacity-80 text-gray-700 max-w-2xl mx-auto">
                                Cada semestre no es solo un gasto, también es la llave para acceder a cientos de beneficios por todo el país y el mundo.
                            </p>
                        </div>
                        <p className="text-sm opacity-60 font-semibold tracking-wide uppercase">Haz clic en cualquier ticket para ver los detalles completos.</p>
                    </div>

                    {/* Modal */}
                    <Modal 
                        isOpen={isModalOpen} 
                        onClose={() => setIsModalOpen(false)} 
                        ticket={selectedTicket} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
