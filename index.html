        // --- Sistema de Audio Sintetizado ---
        let audioCtx = null;
        const playHoverSound = () => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (error) {
                console.warn("Audio interaction requires user gesture first.");
            }
        };

                shortTitle: "JetBrains",
                subTitle: "Licencias Gratis",
                title: "Pack JetBrains",
                provider: "JetBrains",
                description: "Si ves materias de programación o estudias alguna ingeniería afín a la tecnología, esta es una herramienta obligatoria. JetBrains ofrece acceso gratuito a todos sus entornos de desarrollo (IDE) profesionales, como IntelliJ IDEA (Java), PyCharm (Python) y WebStorm (JavaScript).\n\nEstas licencias profesionales cuestan normalmente cientos de dólares al año, pero son 100% gratuitas mientras estés matriculado en la universidad.\n\nRegístrate con tu correo .edu.co y renueva tu acceso cada año sin costo.",
                url: "https://www.jetbrains.com/community/education/",
                color: "bg-[#27272a]", 
                textColor: "text-white",
                emoji: "👨‍💻",
                animClass: "animate-emoji-2"
            },
            {
                id: 20,
                shortTitle: "Cultura",
                subTitle: "Descuentos físicos",
                title: "Museos y Cultura",
                provider: "Entidades Culturales",
                description: "¡No todo es digital! Tu carné físico o virtual de la universidad es una llave de oro para la cultura y el entretenimiento presencial en Colombia.\n\nInstituciones icónicas como el Parque Explora, el Museo de Antioquia y el Jardín Botánico (en Medellín), o el MAMBO y Maloka (en Bogotá) ofrecen desde un 30% de descuento hasta entrada totalmente gratuita para estudiantes de pregrado.\n\nSolo debes presentar tu carné estudiantil vigente y tu documento de identidad en las taquillas. ¡Aprovecha para turistear y aprender a bajo costo!",
                url: "https://museoscolombianos.gov.co/",
                color: "bg-[#fbbf24]", 
                textColor: "text-gray-900",
                emoji: "🏛️",
                animClass: "animate-emoji-1"
            }
        ];

        const Ticket = ({ data, onClick }) => {
            const ticketRef = useRef(null);
            const [transformStyle, setTransformStyle] = useState("");
            const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });

            const handleMouseMove = (e) => {
                if (!ticketRef.current) return;
                
                const rect = ticketRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12; 
                const rotateY = ((x - centerX) / centerX) * 12;

                setTransformStyle(`rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`);
                
                setGlare({
                    x: (x / rect.width) * 100,
                    y: (y / rect.height) * 100,
                    opacity: 1
                });
            };

            const handleMouseLeave = () => {
                setTransformStyle("rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
                setGlare(prev => ({ ...prev, opacity: 0 }));
            };

            const handleMouseEnter = () => {
                playHoverSound();
            };

            return (
                <div 
                    className="w-full h-40 sm:h-48 cursor-pointer perspective-container group"
                    onClick={() => onClick(data)}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}
                    onMouseEnter={handleMouseEnter}
                >
                    <div className="absolute inset-0 bg-black/10 rounded-xl blur-lg translate-y-3 scale-95 z-0 transition-all group-hover:bg-black/20 group-hover:translate-y-4"></div>
                    
                    <div 
                        ref={ticketRef}
                        className={`relative h-full w-full ${data.color} ${data.textColor} rounded-2xl flex overflow-hidden ticket-shape border-2 border-white/20 transition-transform duration-200 ease-out z-10`}
                        style={{ transform: transformStyle }}
                    >
                        <div 
                            className="absolute inset-0 pointer-events-none transition-opacity duration-300 z-30 mix-blend-overlay"
                            style={{
                                opacity: glare.opacity,
                                background: `radial-gradient(circle at ${glare.x}% ${glare.y}%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 60%)`
                            }}
                        ></div>

                        <div className="absolute inset-0 ticket-pattern pointer-events-none opacity-40 z-0"></div>

                        <div className={`ticket-edges edge-left text-${data.color.replace('bg-', '')}`}></div>
                        <div className={`ticket-edges edge-right text-${data.color.replace('bg-', '')}`}></div>
                        <div className="ticket-cutout-top"></div>
                        <div className="ticket-cutout-bottom"></div>
                        <div className="ticket-divider-line"></div>

                        <div className="w-3/4 p-4 pl-8 flex flex-col justify-center items-start h-full relative z-20" style={{ transform: 'translateZ(20px)' }}>
                            <span className="text-xs font-bold uppercase tracking-widest opacity-80 mb-1 drop-shadow-md">
                                {data.subTitle}
                            </span>
                            <h2 className="font-ticket text-3xl sm:text-4xl font-black uppercase leading-none drop-shadow-lg">
                                {data.shortTitle}
                            </h2>
                        </div>

                        <div className="w-1/4 flex flex-col items-center justify-center p-2 relative z-20" style={{ transform: 'translateZ(30px)' }}>
                             <div className={`text-5xl sm:text-6xl ${data.animClass}`}>
                                {data.emoji}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, ticket }) => {
            if (!isOpen || !ticket) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-md" onClick={onClose}>
                    <div 
                        /* AQUI ESTA LA MEJORA PRINCIPAL: max-h-[90vh] asegura que no se salga de la pantalla, 
                           y flex-col permite organizar el contenido en secciones fijas y una desplazable */
                        className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl transform transition-all animate-[fadeIn_0.3s_ease-out]"
                        onClick={e => e.stopPropagation()}
                    >
                        {/* ENCABEZADO (Fijo arriba) - Reducimos un poco el padding para ganar espacio */}
                        <div className={`flex-shrink-0 p-5 sm:p-6 ${ticket.color} ${ticket.textColor} relative ticket-pattern rounded-t-2xl`}>
                            <button onClick={onClose} className="absolute top-3 right-3 sm:top-4 sm:right-4 bg-black/20 hover:bg-black/40 text-white rounded-full p-1.5 transition-colors z-20">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                            
                            <div className="flex flex-col items-center text-center mt-1">
                                <div className={`text-5xl sm:text-6xl mb-2 ${ticket.animClass}`}>{ticket.emoji}</div>
                                <p className="text-xs sm:text-sm font-bold uppercase tracking-wider opacity-90">{ticket.provider}</p>
                                <h3 className="font-ticket text-2xl sm:text-3xl font-black uppercase leading-tight mt-1 drop-shadow-md">{ticket.title}</h3>
                            </div>
                        </div>

                        {/* CUERPO (Con scroll independiente) */}
                        <div className="p-5 sm:p-7 overflow-y-auto modal-scroll flex-grow relative bg-white">
                            <div className="text-gray-700 leading-relaxed text-sm sm:text-base space-y-4">
                                {ticket.description.split('\n').map((paragraph, idx) => (
                                    paragraph.trim() !== '' && <p key={idx}>{paragraph}</p>
                                ))}
                            </div>
                            
                            <div className="bg-blue-50 border-l-4 border-blue-500 p-3 sm:p-4 rounded-r-lg mt-6">
                                <p className="text-xs sm:text-sm text-blue-800 flex items-start gap-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                                    <span>Para redimir, asegúrate de utilizar tu <strong>correo institucional (.edu.co)</strong> en el sitio web del proveedor.</span>
                                </p>
                            </div>
                        </div>

                        {/* PIE DE PÁGINA (Fijo abajo con el CTA) */}
                        <div className="p-4 sm:p-5 bg-gray-50 border-t border-gray-100 flex-shrink-0 rounded-b-2xl">
                            <a 
                                href={ticket.url} target="_blank" rel="noopener noreferrer"
                                className={`flex items-center justify-center w-full py-3 px-4 text-center text-white font-bold text-base sm:text-lg rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 ${ticket.color}`}
                                style={{ color: ticket.textColor === 'text-gray-900' ? '#111827' : 'white' }}
                            >
                                ¡Reclamar Descuento!
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);

            useEffect(() => {
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fadeIn {
                        from { opacity: 0; transform: scale(0.95) translateY(10px); }
                        to { opacity: 1; transform: scale(1) translateY(0); }
                    }
                `;
                document.head.appendChild(style);
                return () => document.head.removeChild(style);
            }, []);

            return (
                <div className="min-h-screen py-10 px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="max-w-6xl mx-auto mb-20 relative mt-4">
                        <div className="relative overflow-hidden bg-white/50 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl border border-white p-8 sm:p-14 flex flex-col md:flex-row items-center justify-between gap-10">
                            <div className="absolute -top-20 -right-20 w-64 h-64 bg-pink-300 rounded-full blur-3xl opacity-40 pointer-events-none"></div>
                            <div className="absolute -bottom-20 -left-20 w-64 h-64 bg-blue-300 rounded-full blur-3xl opacity-40 pointer-events-none"></div>
                            
                            <div className="text-left flex-1 relative z-10">
                                <span className="inline-flex items-center gap-2 py-1.5 px-4 rounded-full bg-indigo-100 text-indigo-800 text-sm font-bold tracking-widest mb-6 uppercase shadow-sm">
                                    <span className="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                                    Beneficios Exclusivos
                                </span>
                                <h1 className="font-ticket text-5xl sm:text-6xl md:text-7xl font-black text-gray-900 drop-shadow-sm mb-4 uppercase tracking-tighter leading-[0.9]">
                                    Tiquetera <br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">
                                        Estudiantil
                                    </span>
                                </h1>
                                <p className="text-lg md:text-xl text-gray-700 font-medium max-w-xl leading-relaxed">
                                    ¡Pasa el mouse sobre los tiquetes para ver la magia! Demuestra que ser estudiante paga desbloqueando descuentos increíbles con tu correo institucional <strong className="text-gray-900 bg-yellow-200/50 px-1 rounded">.edu.co</strong>.
                                </p>
                            </div>
                            
                            <div className="relative z-10 flex-shrink-0 animate-emoji-2 hidden md:block">
                                <div className="text-[9rem] drop-shadow-2xl">🎟️</div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-y-12 gap-x-10">
                        {ticketData.map(ticket => (
                            <div key={ticket.id} className="flex justify-center">
                                <div className="w-full max-w-[450px]"> 
                                    <Ticket 
                                        data={ticket} 
                                        onClick={(t) => { setSelectedTicket(t); setIsModalOpen(true); }} 
                                    />
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="max-w-4xl mx-auto text-center mt-24 pb-12 text-gray-800 font-medium px-4 relative z-10">
                        <div className="bg-white/60 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-xl border border-white mb-6 transform transition hover:scale-[1.01]">
                            <p className="text-xl sm:text-2xl mb-4 text-gray-900 leading-snug">
                                Que ser estudiante no solo sea un sacrificio, <br className="hidden sm:block"/>
                                <strong className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 font-black text-2xl sm:text-3xl">¡Sácale provecho a tu correo y carné!</strong>
                            </p>
                            <p className="text-base sm:text-lg opacity-80 text-gray-700 max-w-2xl mx-auto">
                                Cada semestre no es solo un gasto, también es la llave para acceder a cientos de beneficios por todo el país y el mundo.
                            </p>
                        </div>
                        <p className="text-sm opacity-60 font-semibold tracking-wide uppercase mb-8">Haz clic en cualquier ticket para ver los detalles completos.</p>
                        
                        <div className="max-w-3xl mx-auto text-xs opacity-70 font-medium leading-relaxed text-gray-600 bg-gray-200/50 backdrop-blur-sm p-4 rounded-xl border border-gray-300/50 text-left sm:text-center">
                            <span className="font-bold text-gray-800">⚠️ Aviso importante:</span> Los beneficios y descuentos presentados en esta tiquetera son administrados y ofrecidos exclusivamente por entidades de terceros. La <strong>UCN</strong> proporciona esta información con fines netamente informativos y no asume responsabilidad alguna por cambios en las políticas, términos, condiciones, o la disponibilidad final de los servicios por parte de los proveedores externos.
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} ticket={selectedTicket} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
